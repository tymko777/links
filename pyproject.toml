[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "links"
version = "0.5.0"
description = "A calm GNOME-native launcher for links, actions, and files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tymko" }]
keywords = ["gtk4", "libadwaita", "gnome", "launcher", "flatpak"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Wayland",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
links = "links.main:main"
links-cli = "links.cli:main"

[tool.setuptools]
packages = ["links", "links.services", "links.ui"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# PyGObject requires gi.require_version() before importing gi.repository.
ignore = ["E402"]
